<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViralClips AI</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #0b0b14; color: white; }
header { padding: 22px 8%; border-bottom: 1px solid #29293b; font-size: 24px; font-weight: bold; }
header span, h1 span { color: #a78bfa; }
main { max-width: 760px; margin: 45px auto; padding: 20px; }
h1 { text-align: center; font-size: 36px; }
.intro { text-align: center; color: #aaaabd; }
.panel { background: #171725; border: 1px solid #343449; border-radius: 18px; padding: 24px; margin-top: 25px; }
input[type=file] { width: 100%; padding: 14px; background: #242438; color: white; border-radius: 10px; margin-top: 12px; }
video { width: 100%; margin-top: 20px; border-radius: 12px; background: black; display: none; }
.info, .selection { background: #242438; padding: 15px; border-radius: 10px; margin-top: 15px; }
.selection { display: none; }
label { display: block; margin-top: 18px; }
input[type=number] { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #44445c; background: #171725; color: white; }
button { width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 10px; background: #7c3aed; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
button.secondary { background: #343449; }
p { color: #aaaabd; line-height: 1.5; }
#estado { color: #c4b5fd; }
footer { text-align: center; color: #777; padding: 30px; }
</style>
</head>
<body>
<header>ViralClips <span>AI</span></header>
<main>
<h1>Crea tus <span>clips virales</span></h1>
<p class="intro">Selecciona los mejores fragmentos de tus vídeos.</p>
<section class="panel">
<strong>1. Selecciona tu vídeo</strong>
<input id="videoFile" type="file" accept="video/*">
<video id="preview" controls></video>
<div class="info" id="info" hidden>
<p id="nombre"></p><p id="duracion"></p><p id="resolucion"></p>
</div>
<div class="selection" id="selection">
<h3>2. Selecciona tu fragmento</h3>
<label for="inicio">Segundo de inicio</label>
<input id="inicio" type="number" min="0" value="0" step="0.1">
<label for="final">Segundo de finalización</label>
<input id="final" type="number" min="0" value="10" step="0.1">
<button onclick="previsualizar()">VER FRAGMENTO</button>
<button class="secondary" onclick="volver()">VOLVER AL INICIO</button>
<button onclick="exportarMP4()">EXPORTAR CLIP MP4</button>
<label for="duracionClip">Duración del clip</label>
<select id="duracionClip">
  <option value="15">15 segundos</option>
  <option value="30" selected>30 segundos (recomendado)</option>
  <option value="45">45 segundos</option>
  <option value="60">60 segundos</option>
</select>
<button onclick="detectarTresMomentos()">DETECTAR MOMENTOS AUTOMÁTICAMENTE</button>
<div id="resultadosMomentos"></div>
<button onclick="generarSubtitulos()">GENERAR SUBTÍTULOS AUTOMÁTICOS</button>
<div id="resultadoSubtitulos"></div>
<p id="fragmento"></p>
</div>
<p id="estado">Esperando tu vídeo...</p>
</section>
</main>
<footer>ViralClips AI · Tu herramienta de clips</footer>
<script>
const selector = document.getElementById("videoFile");
const preview = document.getElementById("preview");
const info = document.getElementById("info");
const selection = document.getElementById("selection");
const estado = document.getElementById("estado");
let videoURL = null;
let duracionTotal = 0;

selector.addEventListener("change", function() {
  const archivo = this.files[0];
  if (!archivo) return;
  if (videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(archivo);
  preview.src = videoURL;
  preview.style.display = "block";
  info.hidden = false;
  selection.style.display = "block";
  document.getElementById("nombre").textContent = "Archivo: " + archivo.name;
  estado.textContent = "Leyendo vídeo...";
  preview.onloadedmetadata = function() {
    duracionTotal = preview.duration;
    document.getElementById("duracion").textContent = "Duración: " + duracionTotal.toFixed(1) + " segundos";
    document.getElementById("resolucion").textContent = "Resolución: " + preview.videoWidth + " × " + preview.videoHeight;
    document.getElementById("inicio").value = 0;
    document.getElementById("final").value = Math.min(10, Math.floor(duracionTotal));
    document.getElementById("final").max = duracionTotal;
    estado.textContent = "¡Vídeo cargado correctamente!";
  };
  preview.onerror = function() { estado.textContent = "No se pudo leer este vídeo."; };
});

function previsualizar() {
  const inicio = Number(document.getElementById("inicio").value);
  const final = Number(document.getElementById("final").value);
  if (!duracionTotal) { estado.textContent = "Primero carga un vídeo."; return; }
  if (!Number.isFinite(inicio) || !Number.isFinite(final) || inicio < 0 || final > duracionTotal || final <= inicio) {
    estado.textContent = "Comprueba el inicio y el final del fragmento."; return;
  }
  preview.currentTime = inicio;
  preview.play();
  document.getElementById("fragmento").textContent = "Fragmento seleccionado: " + inicio + " s hasta " + final + " s (" + (final-inicio).toFixed(1) + " segundos).";
  estado.textContent = "Reproduciendo la vista previa. Se detendrá en el segundo " + final + ".";
  preview.ontimeupdate = function() {
    if (preview.currentTime >= final) {
      preview.pause();
      preview.ontimeupdate = null;
      estado.textContent = "Vista previa terminada.";
    }
  };
}

function volver() {
  preview.pause();
  preview.currentTime = 0;
  preview.ontimeupdate = null;
  estado.textContent = "Vídeo preparado.";
}

async function exportarMP4() {
  const inicio = Number(document.getElementById("inicio").value);
  const final = Number(document.getElementById("final").value);

  if (!duracionTotal || final <= inicio || inicio < 0 || final > duracionTotal) {
    estado.textContent = "Comprueba los segundos del fragmento.";
    return;
  }

  if (!preview.captureStream || !window.MediaRecorder) {
    estado.textContent = "Tu navegador no admite esta exportación.";
    return;
  }

  const tipo = "video/mp4;codecs=avc1.42E01E,mp4a.40.2";

  if (!MediaRecorder.isTypeSupported(tipo)) {
    estado.textContent = "Chrome no admite grabar MP4 con este códec.";
    return;
  }

  try {
    estado.textContent = "Preparando exportación MP4...";

    preview.pause();
    preview.currentTime = inicio;

    await new Promise(resolve => {
      preview.addEventListener("seeked", resolve, { once: true });
    });

    const stream = preview.captureStream();
    const partes = [];
    const grabador = new MediaRecorder(stream, { mimeType: tipo });

    grabador.ondataavailable = evento => {
      if (evento.data.size > 0) partes.push(evento.data);
    };

    grabador.onstop = () => {
      const archivo = new Blob(partes, { type: "video/mp4" });
      const url = URL.createObjectURL(archivo);
      const enlace = document.createElement("a");

      enlace.href = url;
      enlace.download = "ViralClips-clip.mp4";
      enlace.click();

      setTimeout(() => URL.revokeObjectURL(url), 10000);
      stream.getTracks().forEach(pista => pista.stop());
      estado.textContent = "¡Exportación terminada!";
    };

    preview.ontimeupdate = () => {
      if (preview.currentTime >= final) {
        preview.pause();
        preview.ontimeupdate = null;
        grabador.stop();
      }
    };

    grabador.start();
    await preview.play();

    estado.textContent = "Exportando tu clip MP4...";
  } catch (error) {
    estado.textContent = "Error al exportar: " + error.message;
  }
}
async function detectarMomentos() {
  if (!preview.src || !duracionTotal) {
    estado.textContent = "Primero sube un vídeo.";
    return;
  }

  estado.textContent = "Analizando el volumen del vídeo...";

  try {
    const contexto = new AudioContext();
    const respuesta = await fetch(preview.src);
    const datos = await respuesta.arrayBuffer();
    const audio = await contexto.decodeAudioData(datos);

    const canal = audio.getChannelData(0);
    const frecuencia = audio.sampleRate;
    const bloques = [];
    const tamaño = Math.floor(frecuencia * 2);

    for (let i = 0; i < canal.length; i += tamaño) {
      let suma = 0;
      const limite = Math.min(i + tamaño, canal.length);

      for (let j = i; j < limite; j++) {
        suma += canal[j] * canal[j];
      }

      bloques.push({
        segundo: i / frecuencia,
        volumen: Math.sqrt(suma / (limite - i))
      });
    }

    const maximo = Math.max(...bloques.map(b => b.volumen));

    if (maximo === 0) {
      estado.textContent = "No se ha detectado audio.";
      await contexto.close();
      return;
    }

    const mejores = bloques
      .filter(b => b.volumen > maximo * 0.65)
      .sort((a, b) => b.volumen - a.volumen)
      .slice(0, 5)
      .sort((a, b) => a.segundo - b.segundo);

    if (mejores.length === 0) {
      estado.textContent = "No se encontraron momentos destacados.";
      await contexto.close();
      return;
    }

document.getElementById("inicio").value = Math.max(0, Math.floor(mejores[0].segundo));
const duracionClip = Number(document.getElementById("duracionClip").value);
document.getElementById("final").value = Math.min(duracionTotal, Math.floor(mejores[0].segundo) + duracionClip);

    estado.textContent = "¡Momento destacado encontrado! Revisa el fragmento.";

    await contexto.close();

  } catch (error) {
    estado.textContent = "No se pudo analizar el audio: " + error.message;
  }
}
function seleccionarMomento(inicio, final) {
  document.getElementById("inicio").value = inicio;
  document.getElementById("final").value = final;
  estado.textContent = "Momento seleccionado. Pulsa VER FRAGMENTO.";
}

async function detectarTresMomentos() {
  if (!preview.src || !duracionTotal) {
    estado.textContent = "Primero sube un vídeo.";
    return;
  }

  const contenedor = document.getElementById("resultadosMomentos");
  contenedor.innerHTML = "";
  estado.textContent = "Analizando el volumen del vídeo...";

  let contexto;

  try {
    contexto = new AudioContext();
    const respuesta = await fetch(preview.src);
    const datos = await respuesta.arrayBuffer();
    const audio = await contexto.decodeAudioData(datos);

    const canal = audio.getChannelData(0);
    const frecuencia = audio.sampleRate;
    const bloques = [];
    const tamaño = Math.floor(frecuencia * 2);

    for (let i = 0; i < canal.length; i += tamaño) {
      let suma = 0;
      const limite = Math.min(i + tamaño, canal.length);

      for (let j = i; j < limite; j++) {
        suma += canal[j] * canal[j];
      }

      bloques.push({
        segundo: i / frecuencia,
        volumen: Math.sqrt(suma / (limite - i))
      });
    }

    const maximo = Math.max(...bloques.map(b => b.volumen));

    if (!Number.isFinite(maximo) || maximo === 0) {
      estado.textContent = "No se ha detectado audio.";
      return;
    }

    const duracionClip = Number(document.getElementById("duracionClip").value);
    const maxInicio = Math.max(0, duracionTotal - duracionClip);
    const candidatos = [...bloques].sort((a, b) => b.volumen - a.volumen);
    const seleccionados = [];

    for (const bloque of candidatos) {
      const centro = bloque.segundo + 1;
      const inicio = Math.max(0, Math.min(maxInicio, Math.floor(centro - duracionClip / 2)));
      const final = Math.min(duracionTotal, inicio + duracionClip);

      const repetido = seleccionados.some(m =>
        Math.abs(m.inicio - inicio) < duracionClip
      );

      if (!repetido) seleccionados.push({ inicio, final });
      if (seleccionados.length === 3) break;
    }

    seleccionados.forEach((momento, indice) => {
      const boton = document.createElement("button");
      boton.textContent = "SELECCIONAR MOMENTO " + (indice + 1) +
        " (" + Math.floor(momento.inicio) + "s - " +
        Math.floor(momento.final) + "s)";

      boton.onclick = () => seleccionarMomento(momento.inicio, momento.final);
      contenedor.appendChild(boton);
    });

    estado.textContent = "Se han encontrado " + seleccionados.length +
      " momentos según el volumen del audio.";

  } catch (error) {
    estado.textContent = "No se pudo analizar el audio: " + error.message;
  } finally {
    if (contexto && contexto.state !== "closed") {
      await contexto.close();
    }
  }
}  
let trabajadorSubtitulos = null;
function crearTrabajadorSubtitulos() {
  const codigo = `
    import { pipeline, env } from
      "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";

    env.allowLocalModels = false;
    env.backends.onnx.wasm.numThreads = 1;

    let modelo = null;

    self.onmessage = async (evento) => {
      try {
        if (!modelo) {
          modelo = await pipeline(
            "automatic-speech-recognition",
            "Xenova/whisper-tiny"
          );
        }

        const resultado = await modelo(evento.data, {
          sampling_rate: 16000,
          return_timestamps: true,
          chunk_length_s: 30,
          stride_length_s: 5,
          task: "transcribe"
        });

        self.postMessage({ ok: true, resultado });
      } catch (error) {
        self.postMessage({
          ok: false,
          error: error.message
        });
      }
    };
  `;

  const blob = new Blob([codigo], {
    type: "text/javascript"
  });

  return new Worker(
    URL.createObjectURL(blob),
    { type: "module" }
  );
}
async function generarSubtitulos() {
  const archivo = selector.files[0];

  if (!archivo) {
    estado.textContent = "Primero sube un vídeo.";
    return;
  }

  let contexto;

  try {
    estado.textContent = "Preparando el audio...";

    contexto = new AudioContext();
    const datos = await archivo.arrayBuffer();
    const audio = await contexto.decodeAudioData(datos);

    const mono = audio.getChannelData(0);
    const frecuencia = 16000;
    const paso = audio.sampleRate / frecuencia;

    const muestras = new Float32Array(
      Math.floor(mono.length / paso)
    );

    for (let i = 0; i < muestras.length; i++) {
      muestras[i] = mono[Math.floor(i * paso)];
    }

    estado.textContent = "Preparando el modelo de voz...";

    if (!trabajadorSubtitulos) {
      trabajadorSubtitulos = crearTrabajadorSubtitulos();
    }

    estado.textContent = "Generando subtítulos...";

    const resultado = await new Promise((resolve, reject) => {
      trabajadorSubtitulos.onmessage = (evento) => {
        if (evento.data.ok) {
          resolve(evento.data.resultado);
        } else {
          reject(new Error(evento.data.error));
        }
      };

      trabajadorSubtitulos.onerror = () => {
        reject(new Error("Error en el trabajador de voz."));
      };

      trabajadorSubtitulos.postMessage(muestras);
    });

    const fragmentos = resultado.chunks || [];

    if (!fragmentos.length) {
      throw new Error("No se pudieron obtener los tiempos de los subtítulos.");
    }

    function tiempoVTT(segundos) {
      const ms = Math.floor((segundos % 1) * 1000);
      const total = Math.floor(segundos);
      const s = total % 60;
      const m = Math.floor(total / 60) % 60;
      const h = Math.floor(total / 3600);

      return String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0") + "." +
        String(ms).padStart(3, "0");
    }

    let vtt = "WEBVTT\n\n";

    fragmentos.forEach((f, i) => {
      if (!f.timestamp || f.timestamp[1] === null) return;

      vtt += (i + 1) + "\n";
      vtt += tiempoVTT(f.timestamp[0]) + " --> " +
        tiempoVTT(f.timestamp[1]) + "\n";
      vtt += f.text.trim() + "\n\n";
    });

    const blob = new Blob([vtt], { type: "text/vtt" });
    const url = URL.createObjectURL(blob);

    preview.querySelectorAll("track[data-auto-subtitles]")
      .forEach(t => t.remove());

    const pista = document.createElement("track");
    pista.kind = "subtitles";
    pista.label = "Subtítulos automáticos";
    pista.srclang = "es";
    pista.default = true;
    pista.src = url;
    pista.dataset.autoSubtitles = "true";
    preview.appendChild(pista);

    pista.track.mode = "showing";

    const enlace = document.createElement("a");
    enlace.href = url;
    enlace.download = "subtitulos.vtt";
    enlace.textContent = "DESCARGAR SUBTÍTULOS";

    document.getElementById("resultadoSubtitulos")
      .replaceChildren(enlace);

    estado.textContent = "¡Subtítulos generados correctamente!";

  } catch (error) {
    estado.textContent = "Error al generar subtítulos: " + error.message;
  } finally {
    if (contexto && contexto.state !== "closed") {
      await contexto.close();
    }
  }
}
</script>
</body>
</html>
