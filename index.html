
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViralClips AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b14;
      color: white;
    }
    header {
      padding: 22px 8%;
      border-bottom: 1px solid #29293b;
      font-size: 24px;
      font-weight: bold;
    }
    header span, h1 span { color: #a78bfa; }
    main {
      max-width: 760px;
      margin: 55px auto;
      padding: 25px;
      text-align: center;
    }
    h1 { font-size: 38px; }
    p { color: #aaaabd; line-height: 1.6; }
    .panel {
      background: #171725;
      border: 1px solid #343449;
      border-radius: 18px;
      padding: 25px;
      margin-top: 30px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 14px;
      background: #242438;
      color: white;
      border-radius: 10px;
      border: 1px solid #44445c;
      margin-top: 12px;
    }
    video {
      width: 100%;
      max-height: 420px;
      margin-top: 20px;
      border-radius: 12px;
      background: black;
      display: none;
    }
    .info {
      background: #242438;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      display: none;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    footer {
      text-align: center;
      color: #777;
      padding: 30px;
    }
  </style>
</head>
<body>
  <header>ViralClips <span>AI</span></header>

  <main>
    <h1>Convierte tus vídeos en <span>clips virales</span></h1>
    <p>Sube un vídeo y prepara tus mejores momentos para TikTok y YouTube Shorts.</p>

    <section class="panel">
      <strong>Selecciona tu vídeo</strong>
      <input id="videoFile" type="file" accept="video/*">

      <video id="preview" controls></video>

      <div class="info" id="info">
        <p id="nombre"></p>
        <p id="duracion"></p>
        <p id="resolucion"></p>
      </div>

      <button onclick="analizar()">ANALIZAR VÍDEO</button>
      <p id="estado">Esperando tu vídeo...</p>
    </section>
  </main>

  <footer>ViralClips AI · Tu herramienta de clips</footer>

  <script>
    const selector = document.getElementById("videoFile");
    const preview = document.getElementById("preview");
    const info = document.getElementById("info");
    const estado = document.getElementById("estado");

    let videoURL = null;

    selector.addEventListener("change", function() {
      const archivo = this.files[0];

      if (!archivo) return;

      if (videoURL) URL.revokeObjectURL(videoURL);

      videoURL = URL.createObjectURL(archivo);
      preview.src = videoURL;
      preview.style.display = "block";
      info.style.display = "block";

      document.getElementById("nombre").textContent =
        "Archivo: " + archivo.name;

      estado.textContent = "Cargando información del vídeo...";

      preview.onloadedmetadata = function() {
        const minutos = Math.floor(preview.duration / 60);
        const segundos = Math.floor(preview.duration % 60);

        document.getElementById("duracion").textContent =
          "Duración: " + minutos + " min " + segundos + " s";

        document.getElementById("resolucion").textContent =
          "Resolución: " + preview.videoWidth + " × " + preview.videoHeight;

        estado.textContent = "¡Vídeo cargado correctamente!";
      };

      preview.onerror = function() {
        estado.textContent = "No se pudo leer este formato de vídeo.";
      };
    });

    function analizar() {
      if (!selector.files.length) {
        estado.textContent = "Primero selecciona un vídeo.";
        return;
      }

      estado.textContent =
        "Vídeo preparado. El análisis automático llegará en una siguiente versión.";
    }
  </script>
</body>
</html>
