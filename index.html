<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViralClips AI</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #0b0b14; color: white; }
header { padding: 22px 8%; border-bottom: 1px solid #29293b; font-size: 24px; font-weight: bold; }
header span, h1 span { color: #a78bfa; }
main { max-width: 760px; margin: 45px auto; padding: 20px; }
h1 { text-align: center; font-size: 36px; }
.intro { text-align: center; color: #aaaabd; }
.panel { background: #171725; border: 1px solid #343449; border-radius: 18px; padding: 24px; margin-top: 25px; }
input[type=file] { width: 100%; padding: 14px; background: #242438; color: white; border-radius: 10px; margin-top: 12px; }
video { width: 100%; margin-top: 20px; border-radius: 12px; background: black; display: none; }
.info, .selection { background: #242438; padding: 15px; border-radius: 10px; margin-top: 15px; }
.selection { display: none; }
label { display: block; margin-top: 18px; }
input[type=number] { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #44445c; background: #171725; color: white; }
button { width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 10px; background: #7c3aed; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
button.secondary { background: #343449; }
p { color: #aaaabd; line-height: 1.5; }
#estado { color: #c4b5fd; }
footer { text-align: center; color: #777; padding: 30px; }
</style>
</head>
<body>
<header>ViralClips <span>AI</span></header>
<main>
<h1>Crea tus <span>clips virales</span></h1>
<p class="intro">Selecciona los mejores fragmentos de tus vídeos.</p>
<section class="panel">
<strong>1. Selecciona tu vídeo</strong>
<input id="videoFile" type="file" accept="video/*">
<video id="preview" controls></video>
<div class="info" id="info" hidden>
<p id="nombre"></p><p id="duracion"></p><p id="resolucion"></p>
</div>
<div class="selection" id="selection">
<h3>2. Selecciona tu fragmento</h3>
<label for="inicio">Segundo de inicio</label>
<input id="inicio" type="number" min="0" value="0" step="0.1">
<label for="final">Segundo de finalización</label>
<input id="final" type="number" min="0" value="10" step="0.1">
<button onclick="previsualizar()">VER FRAGMENTO</button>
<button class="secondary" onclick="volver()">VOLVER AL INICIO</button>
<button onclick="exportarMP4()">EXPORTAR CLIP MP4</button>
<p id="fragmento"></p>
</div>
<p id="estado">Esperando tu vídeo...</p>
</section>
</main>
<footer>ViralClips AI · Tu herramienta de clips</footer>
<script>
const selector = document.getElementById("videoFile");
const preview = document.getElementById("preview");
const info = document.getElementById("info");
const selection = document.getElementById("selection");
const estado = document.getElementById("estado");
let videoURL = null;
let duracionTotal = 0;

selector.addEventListener("change", function() {
  const archivo = this.files[0];
  if (!archivo) return;
  if (videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(archivo);
  preview.src = videoURL;
  preview.style.display = "block";
  info.hidden = false;
  selection.style.display = "block";
  document.getElementById("nombre").textContent = "Archivo: " + archivo.name;
  estado.textContent = "Leyendo vídeo...";
  preview.onloadedmetadata = function() {
    duracionTotal = preview.duration;
    document.getElementById("duracion").textContent = "Duración: " + duracionTotal.toFixed(1) + " segundos";
    document.getElementById("resolucion").textContent = "Resolución: " + preview.videoWidth + " × " + preview.videoHeight;
    document.getElementById("inicio").value = 0;
    document.getElementById("final").value = Math.min(10, Math.floor(duracionTotal));
    document.getElementById("final").max = duracionTotal;
    estado.textContent = "¡Vídeo cargado correctamente!";
  };
  preview.onerror = function() { estado.textContent = "No se pudo leer este vídeo."; };
});

function previsualizar() {
  const inicio = Number(document.getElementById("inicio").value);
  const final = Number(document.getElementById("final").value);
  if (!duracionTotal) { estado.textContent = "Primero carga un vídeo."; return; }
  if (!Number.isFinite(inicio) || !Number.isFinite(final) || inicio < 0 || final > duracionTotal || final <= inicio) {
    estado.textContent = "Comprueba el inicio y el final del fragmento."; return;
  }
  preview.currentTime = inicio;
  preview.play();
  document.getElementById("fragmento").textContent = "Fragmento seleccionado: " + inicio + " s hasta " + final + " s (" + (final-inicio).toFixed(1) + " segundos).";
  estado.textContent = "Reproduciendo la vista previa. Se detendrá en el segundo " + final + ".";
  preview.ontimeupdate = function() {
    if (preview.currentTime >= final) {
      preview.pause();
      preview.ontimeupdate = null;
      estado.textContent = "Vista previa terminada.";
    }
  };
}

function volver() {
  preview.pause();
  preview.currentTime = 0;
  preview.ontimeupdate = null;
  estado.textContent = "Vídeo preparado.";
}

async function exportarMP4() {
  const inicio = Number(document.getElementById("inicio").value);
  const final = Number(document.getElementById("final").value);

  if (!duracionTotal || final <= inicio || inicio < 0 || final > duracionTotal) {
    estado.textContent = "Comprueba los segundos del fragmento.";
    return;
  }

  if (!preview.captureStream || !window.MediaRecorder) {
    estado.textContent = "Tu navegador no admite esta exportación.";
    return;
  }

  const tipo = "video/mp4;codecs=avc1.42E01E,mp4a.40.2";

  if (!MediaRecorder.isTypeSupported(tipo)) {
    estado.textContent = "Chrome no admite grabar MP4 con este códec.";
    return;
  }

  try {
    estado.textContent = "Preparando exportación MP4...";

    preview.pause();
    preview.currentTime = inicio;

    await new Promise(resolve => {
      preview.addEventListener("seeked", resolve, { once: true });
    });

    const stream = preview.captureStream();
    const partes = [];
    const grabador = new MediaRecorder(stream, { mimeType: tipo });

    grabador.ondataavailable = evento => {
      if (evento.data.size > 0) partes.push(evento.data);
    };

    grabador.onstop = () => {
      const archivo = new Blob(partes, { type: "video/mp4" });
      const url = URL.createObjectURL(archivo);
      const enlace = document.createElement("a");

      enlace.href = url;
      enlace.download = "ViralClips-clip.mp4";
      enlace.click();

      setTimeout(() => URL.revokeObjectURL(url), 10000);
      stream.getTracks().forEach(pista => pista.stop());
      estado.textContent = "¡Exportación terminada!";
    };

    preview.ontimeupdate = () => {
      if (preview.currentTime >= final) {
        preview.pause();
        preview.ontimeupdate = null;
        grabador.stop();
      }
    };

    grabador.start();
    await preview.play();

    estado.textContent = "Exportando tu clip MP4...";
  } catch (error) {
    estado.textContent = "Error al exportar: " + error.message;
  }
}

</script>
</body>
</html>
